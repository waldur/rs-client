[package]
name = "waldur-client"
version = "8.1.2"
edition = "2021"
# Must match the rust image in .gitlab-ci.yml. With resolver 3, cargo picks
# the newest dependency versions that still build on this toolchain, so a
# crate raising its MSRV (uuid 1.27 -> 1.89) cannot break the nightly build.
rust-version = "1.88"
resolver = "3"
license = "MIT"
description = "Rust client for Waldur MasterMind, generated from the OpenAPI schema (OpenStack + team management surface)"
repository = "https://github.com/waldur/rs-client"
readme = "README.md"

[dependencies]
# Kept in sync with src/generated/REQUIRED_DEPS.toml, emitted by
# `openapi-to-rust generate` -- re-check that file after regenerating.
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
reqwest-middleware = "0.4"
reqwest-tracing = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
